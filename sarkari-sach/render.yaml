services:
  - type: web
    name: sarkari-sach-api
    runtime: python
    plan: free
    rootDir: sarkari-sach/backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /v1/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: PYTHONIOENCODING
        value: utf-8
      - key: PYTHONUTF8
        value: "1"
      - key: OFFLINE_MODE
        value: "false"
      - key: LLM_PROVIDER
        value: fake # Set to 'gemini' in Render dashboard if you add GEMINI_API_KEY
      - key: GEMINI_API_KEY
        sync: false # Set in Render dashboard environment variables
      - key: CORS_ORIGINS
        value: "*"

